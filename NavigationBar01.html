<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notched Bubble Nav</title>
  <style>
    :root {
      --nav-bg: #111;
      --bubble-color: #39ff14;
      --icon-inactive: #999;
      --page-bg: #8f43ff;
      --nav-h: 40px;
      --bubble-d: 40px;                             /* smaller bubble */
      --notch-d: calc(var(--bubble-d) + 16px);      /* notch 16px larger */
      --radius: calc(var(--nav-h) / 2);
      --transition: 0.3s;
      --icons: 4;
    }

    *, *::before, *::after {
      box-sizing: border-box; margin:0; padding:0;
    }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--page-bg);
      font-family: sans-serif;
    }

    /* single pill nav */
    .nav {
      position: relative;
      width: 320px;
      height: var(--nav-h);
      background: var(--nav-bg);
      border-radius: var(--radius);
      overflow: visible;
    }

    .nav input { display: none; }

    /* the “notch” circle, hides a chunk of the nav */
    .nav .notch {
      position: absolute;
      top: calc((var(--nav-h) - var(--notch-d)) / 2);
      width: var(--notch-d);
      height: var(--notch-d);
      background: var(--page-bg);
      border-radius: 50%;
      z-index: 1;
      transition: left var(--transition);
    }

    /* the green bubble */
    .nav .bubble {
      position: absolute;
      top: calc((var(--nav-h) - var(--bubble-d)) / 2);
      width: var(--bubble-d);
      height: var(--bubble-d);
      background: var(--bubble-color);
      border-radius: 50%;
      z-index: 2;
      transition: left var(--transition);
    }

    /* icons */
    .nav label {
      position: absolute;
      z-index: 3;
      width: calc(100% / var(--icons));
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--icon-inactive);
      cursor: pointer;
      transition: color var(--transition);
    }
    .nav label svg {
      width: 20px; height: 20px;
      fill: currentColor;
    }

    /* place each label in its cell */
    label[for="nav1"] { left: calc(0 * 100%/var(--icons)); }
    label[for="nav2"] { left: calc(1 * 100%/var(--icons)); }
    label[for="nav3"] { left: calc(2 * 100%/var(--icons)); }
    label[for="nav4"] { left: calc(3 * 100%/var(--icons)); }

    /* NOTCH positions */
    #nav1:checked ~ .notch { left: calc((0 * 100%/var(--icons)) + ((100%/var(--icons) - var(--notch-d))/2)); }
    #nav2:checked ~ .notch { left: calc((1 * 100%/var(--icons)) + ((100%/var(--icons) - var(--notch-d))/2)); }
    #nav3:checked ~ .notch { left: calc((2 * 100%/var(--icons)) + ((100%/var(--icons) - var(--notch-d))/2)); }
    #nav4:checked ~ .notch { left: calc((3 * 100%/var(--icons)) + ((100%/var(--icons) - var(--notch-d))/2)); }

    /* BUBBLE positions */
    #nav1:checked ~ .bubble { left: calc((0 * 100%/var(--icons)) + ((100%/var(--icons) - var(--bubble-d))/2)); }
    #nav2:checked ~ .bubble { left: calc((1 * 100%/var(--icons)) + ((100%/var(--icons) - var(--bubble-d))/2)); }
    #nav3:checked ~ .bubble { left: calc((2 * 100%/var(--icons)) + ((100%/var(--icons) - var(--bubble-d))/2)); }
    #nav4:checked ~ .bubble { left: calc((3 * 100%/var(--icons)) + ((100%/var(--icons) - var(--bubble-d))/2)); }

    /* active icon color */
    #nav1:checked ~ label[for="nav1"],
    #nav2:checked ~ label[for="nav2"],
    #nav3:checked ~ label[for="nav3"],
    #nav4:checked ~ label[for="nav4"] {
      color: var(--nav-bg);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <input type="radio" name="nav" id="nav1" checked>
    <input type="radio" name="nav" id="nav2">
    <input type="radio" name="nav" id="nav3">
    <input type="radio" name="nav" id="nav4">

    <div class="notch"></div>
    <div class="bubble"></div>

    <label for="nav1" aria-label="Home">
      <svg viewBox="0 0 576 512"><path d="M280.37 148.26L96 300.11V464a16 16 0 0016 16l112-.29a16 16 0 0016-15.72V368a16 16 0 0116-16h64a16 16 0 0116 16v96a16 16 0 0016 16l112 .29a16 16 0 0016-16V300L295.67 148.26a12.19 12.19 0 00-15.3 0zM571.6 251.47L488 182.6V44a12 12 0 00-12-12h-52a12 12 0 00-12 12v72.61L318.47 43a48 48 0 00-61 0L4.34 251.47a12 12 0 00-1.6 16.9l25.5 31a12 12 0 0016.9 1.6L64 271.69V464a48 48 0 0048 48h368a48 48 0 0048-48V271.7l18.9 15.24a12 12 0 0016.9-1.6l25.5-31a12 12 0 00-1.7-16.87z"/></svg>
    </label>
    <label for="nav2" aria-label="Clock">
      <svg viewBox="0 0 512 512"><path d="M256 8C119.03 8 8 119.03 8 256s111.03 248 248 248 248-111.03 248-248S392.97 8 256 8zm72 272h-88a16 16 0 01-16-16V136a16 16 0 0132 0v112h72a16 16 0 010 32z"/></svg>
    </label>
    <label for="nav3" aria-label="Ban">
      <svg viewBox="0 0 512 512"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm126.2 350.8l-248-248c47.1-41.5 112-41.1 158.2.9l89.8 89.8c42 46.2 42.4 111.1.0 158.3zM256 64c-53 0-102.7 21.6-139.2 58.1l248 248C434.4 358.7 456 309 456 256c0-110.3-89.7-200-200-200z"/></svg>
    </label>
    <label for="nav4" aria-label="User">
      <svg viewBox="0 0 448 512"><path d="M224 256A128 128 0 1096 128a128 128 0 00128 128zm89.6 32h-11.2a174.64 174.64 0 01-156.8 0H134.4A134.4 134.4 0 000 422.4v25.6A64 64 0 0064 512h320a64 64 0 0064-64v-25.6A134.4 134.4 0 00313.6 288z"/></svg>
    </label>
  </nav>
</body>
</html>

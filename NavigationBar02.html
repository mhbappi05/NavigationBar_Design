<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red-Glow Notched Nav</title>
    <style>
        :root {
            --page-bg: #f2dede;
            /* light pink page background */
            --nav-bg: #111;
            /* the pill */
            --icon-off: #999;
            /* inactive icon color */
            --icon-on: #e63946;
            /* active icon + glow */
            --h: 50px;
            /* nav height */
            --r: 25px;
            /* half of nav height */
            --beam-width: 28px;
            /* how wide the glow-beam is */
            --beam-height: 60px;
            /* how tall the glow-beam is */
            --n: 5;
            /* number of icons */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--page-bg);
            font-family: sans-serif;
        }

        nav {
            position: relative;
            display: flex;
            width: calc(80px * var(--n));
            /* adjust per icon count */
            height: var(--h);
            background: var(--nav-bg);
            border-radius: var(--r);
            overflow: visible;
        }

        /* hide the radios */
        nav input {
            display: none;
        }

        /* each “tab” */
        nav label {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--icon-off);
            cursor: pointer;
            transition: color 0.3s;
        }

        nav label svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
        }

        /* when a tab is active… */
        /* color the icon red + add outer glow */
        #i1:checked~label[for="i1"],
        #i2:checked~label[for="i2"],
        #i3:checked~label[for="i3"],
        #i4:checked~label[for="i4"],
        #i5:checked~label[for="i5"] {
            color: var(--icon-on);
            filter: drop-shadow(0 0 8px var(--icon-on));
        }

        /* draw the little red “notch” above the pill */
        #i1:checked~label[for="i1"]::before,
        #i2:checked~label[for="i2"]::before,
        #i3:checked~label[for="i3"]::before,
        #i4:checked~label[for="i4"]::before,
        #i5:checked~label[for="i5"]::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 6px;
            background: var(--icon-on);
            border-radius: 2px 2px 0 0;
            z-index: 1;
        }

        /* draw the red glow-beam shining down */
        #i1:checked~label[for="i1"]::after,
        #i2:checked~label[for="i2"]::after,
        #i3:checked~label[for="i3"]::after,
        #i4:checked~label[for="i4"]::after,
        #i5:checked~label[for="i5"]::after {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(var(--beam-width) * 2);
            height: var(--beam-height);
            background: linear-gradient(var(--icon-on) 0%, transparent 100%);
            clip-path: polygon(50% 0%, 0 100%, 100% 100%);
            border-radius: 0;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>

<body>
    <nav>
        <!-- 1) five hidden radios -->
        <input type="radio" name="nav" id="i1" checked>
        <input type="radio" name="nav" id="i2">
        <input type="radio" name="nav" id="i3">
        <input type="radio" name="nav" id="i4">
        <input type="radio" name="nav" id="i5">

        <!-- 2) five labels/icons -->
        <label for="i1" aria-label="Home">
            <!-- home icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <path d="M9 22V12h6v10" />
            </svg>
        </label>

        <label for="i2" aria-label="Favorites">
            <!-- heart icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
        </label>

        <label for="i3" aria-label="Add">
            <!-- plus icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14" />
            </svg>
        </label>

        <label for="i4" aria-label="Profile">
            <!-- user icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-3-3.87M4 21v-2a4 4 0 0 1 3-3.87" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </label>

        <label for="i5" aria-label="Notifications">
            <!-- bell icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-4 7-4 7h20s-4 0-4-7" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
        </label>
    </nav>
</body>

</html>
